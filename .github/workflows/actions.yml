name: CI

on:
  push:
    branches: ["master"]

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: pyproject.toml
      - name: Install project and development dependencies
        run: uv sync --dev
      - name: Run unit and functional tests
        run: uv run pytest tests/unit tests/functional -q
      - name: Lint with Ruff
        run: uv run ruff check kover tests examples
      - name: Type-check with Pyright
        run: uv run pyright kover tests examples
      - name: Build wheel and source distribution
        run: uv build