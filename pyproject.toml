[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kover"
version = "3.2.0"
description = "A fully asynchronous, strongly typed MongoDB driver for Python."
readme = "README.md"
authors = [{ name = "megawattka", email = "gunter56741@gmail.com" }]
license = "MIT"
requires-python = ">=3.12"
license-files = ["LICENSE"]
keywords = [
    "mongodb",
    "async",
    "asyncio",
    "database",
    "driver",
    "pymongo",
    "bson",
    "odm",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Framework :: AsyncIO",
    "Framework :: Pydantic :: 2",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Database",
    "Typing :: Typed",
]
dependencies = [
    "bson>=0.4.0",  # see below
    "dnspython>=2.7.0",
    "pydantic>=2.14.3",
    "typing-extensions>=4.16.0",
]

[tool.uv.sources]
bson = { index = "bson" }

[[tool.uv.index]]
url = "https://python.wattka.dev/"
name = "bson"
explicit = true

[project.urls]
Homepage = "https://github.com/megawattka/kover"
Repository = "https://github.com/megawattka/kover"
Issues = "https://github.com/megawattka/kover/issues"
Changelog = "https://github.com/megawattka/kover/releases"

[project.optional-dependencies]
snappy = ["python-snappy>=0.7.3"]
zstd = ["zstd>=1.5.7.2"]

[tool.ruff]
line-length = 79
indent-width = 4
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-line-length = "dynamic"

[tool.ruff.lint]
preview = true
ignore = [
    "implicit-namespace-package",  # __init__.py in public namespaces
    "missing-todo-link",  # issue links for todos
    "line-contains-todo",  # TODOs
    "relative-imports",  # fvck absolute imports
    "error-suffix-on-exception-name",  # "Error" suffix in exception class
    "assert",  # assertions
    "hashlib-insecure-hash-function",  # I want to use sha1 please
    "undocumented-magic-method",  # undocumented-magic-method
    "undocumented-public-init",  # undocumented-public-init
    "missing-copyright-notice",  # Copyright notice at the top
    "too-many-arguments",  # too many arguments in function def
    "too-many-positional-arguments",  # too many positional arguments in function def
    "too-many-public-methods",  # too many public methods
    "raw-string-in-exception", "f-string-in-exception", "raise-vanilla-args",  # string literal in exception
    "undocumented-public-package",  # undocumented public package
]
select = ["ALL"]
unfixable = [
    "unused-noqa", # unused noqa
    "T20",  # removes print statements
    "unused-variable", # removes unused variables
]

[tool.ruff.lint.flake8-builtins]
strict-checking = true

[tool.ruff.lint.per-file-ignores]
"kover/__init__.py" = ["line-too-long"]  # line too long
"tests/*" = [
    "undocumented-public-class",  # undocumented public class/method
    "undocumented-public-method",  # undocumented public method
    "undocumented-public-function",
    "typing-only-standard-library-import",  # type checking blocks
    "pytest-unittest-raises-assertion",  # unittest style
    "undocumented-public-module",  # module docstring
    "magic-value-comparison",  # constant comparisons
]

[tool.ruff.lint.flake8-type-checking]
exempt-modules = ["typing", "typing_extensions"]
quote-annotations = true
strict = true

[tool.ruff.lint.isort]
force-sort-within-sections = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.uv]
link-mode="copy"

[dependency-groups]
dev = [
    "flake8 >= 7.4.1",
    "hatchling>=1.27.0",
    "pyright >= 1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff >= 0.17.1",
]

[tool.hatch.build]
include = [
    "README.md",
    "CODE_OF_CONDUCT.md",
    "kover",
    "docs",
    # "Cargo.toml",
    # "rust/*.rs"
]
exclude = [
    "examples",
    "tests",
]

[tool.pyright]
exclude = ["_out"]
typeCheckingMode = "strict"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

