<svg xmlns="http://www.w3.org/2000/svg" width="640" height="180" viewBox="0 0 640 180" role="img" aria-labelledby="title desc">
  <title id="title">Kover</title>
  <desc id="desc">Kover logo with a blue planet, a delicate orbit and small stars.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#101c35"/>
      <stop offset="1" stop-color="#193454"/>
    </linearGradient>
    <radialGradient id="haze" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(99 90) scale(116 104)">
      <stop stop-color="#6eaff0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#6eaff0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planet" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop stop-color="#6098cb"/>
      <stop offset="0.52" stop-color="#3b70aa"/>
      <stop offset="1" stop-color="#274b80"/>
    </linearGradient>
    <linearGradient id="orbit" x1="37" y1="60" x2="167" y2="120" gradientUnits="userSpaceOnUse">
      <stop stop-color="#84bfe8" stop-opacity="0.45"/>
      <stop offset="0.48" stop-color="#c4e9ff"/>
      <stop offset="1" stop-color="#89aee5" stop-opacity="0.65"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#edf8ff"/>
      <stop offset="1" stop-color="#b7d9ef"/>
    </linearGradient>
    <clipPath id="rounded">
      <rect width="640" height="180" rx="30"/>
    </clipPath>
  </defs>

  <g clip-path="url(#rounded)">
    <rect width="640" height="180" fill="url(#background)"/>
    <rect width="230" height="180" fill="url(#haze)"/>

    <!-- Original planet mark with its K, orbit and small satellite. -->
    <circle cx="104" cy="90" r="43" fill="url(#planet)"/>
    <path d="M76 68c8-14 25-22 40-17" fill="none" stroke="#c2e4ff" stroke-width="2" stroke-linecap="round" opacity="0.2"/>
    <path d="M87 111V69h12v20l15-20h15l-19 20 21 22h-15L99 93v18z" fill="url(#wordmark)"/>
    <ellipse cx="104" cy="90" rx="68" ry="25" fill="none" stroke="url(#orbit)" stroke-width="3" transform="rotate(-18 104 90)"/>
    <circle cx="163" cy="66" r="4.5" fill="#d9f2ff"/>
    <circle cx="163" cy="66" r="2" fill="#ffffff"/>
    <path d="m151 36 2.2 6.8 6.8 2.2-6.8 2.2-2.2 6.8-2.2-6.8-6.8-2.2 6.8-2.2z" fill="#dcf3ff"/>

    <!-- Custom monoline wordmark: shared baseline, x-height and stroke. -->
    <g transform="translate(35 0)" fill="none" stroke="url(#wordmark)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M190 52v61M226 70l-31 23 32 20"/>
      <rect x="253" y="70" width="45" height="43" rx="21.5"/>
      <path d="M320 70l22 43 22-43"/>
      <path d="M385 92h45c0-13-9-22-22-22-14 0-23 10-23 22s10 21 23 21c9 0 16-3 21-9"/>
      <path d="M456 113V70M456 85c5-10 14-15 27-15"/>
    </g>

    <!-- Restrained accents away from the wordmark. -->
    <circle cx="527" cy="54" r="1.3" fill="#badfff" opacity="0.5"/>
    <path d="m559 119 1.5 4.5 4.5 1.5-4.5 1.5-1.5 4.5-1.5-4.5-4.5-1.5 4.5-1.5z" fill="#b8dfff" opacity="0.75"/>
  </g>
</svg>
